name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      LLM_MODE: "off"
      PYTHONUTF8: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -rf
